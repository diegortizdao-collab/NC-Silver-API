name = "nc-silver-api"
main = "index.js"
compatibility_date = "2024-09-23"

# DATABASE_URL, APP_PASSWORD y AUTH_SECRET son secretos comunes del Worker
# (Settings > Variables and Secrets > Secret). Sobreviven a cada deploy desde GitHub.
# El binding de Secrets Store se perdía en cada deploy, por eso se quitó de acá.

[[r2_buckets]]
binding = "NC_DOCS"
bucket_name = "silver-industrial-nc-docs"
