name = "nc-silver-api"
main = "index.js"
compatibility_date = "2024-09-23"

[[secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "016a0d22aadd49bfab8f219be3c83f25"
secret_name = "DATABASE_URL"

# Declarados acá para que cada deploy los conserve (si no figuran en este archivo, wrangler los borra).
# Crear una sola vez en Cloudflare > Secrets Store, con estos nombres exactos.
[[secrets_store_secrets]]
binding = "AUTH_SECRET"
store_id = "016a0d22aadd49bfab8f219be3c83f25"
secret_name = "AUTH_SECRET"

[[secrets_store_secrets]]
binding = "APP_PASSWORD"
store_id = "016a0d22aadd49bfab8f219be3c83f25"
secret_name = "APP_PASSWORD"

[[r2_buckets]]
binding = "NC_DOCS"
bucket_name = "silver-industrial-nc-docs"
