name = "nc-silver-api"
main = "index.js"
compatibility_date = "2024-09-23"

# DATABASE_URL, AUTH_SECRET y APP_PASSWORD son Secrets comunes del Worker
# (Cloudflare > Workers > nc-silver-api > Settings > Variables and Secrets > tipo "Secret").
# Los secrets comunes NO se borran con los deploys; los bindings de Secrets Store que no figuren
# en este archivo sí. El código acepta ambos tipos (ver secreto() en index.js).

[[r2_buckets]]
binding = "NC_DOCS"
bucket_name = "silver-industrial-nc-docs"
